<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yunesh Games</title>
<meta name="description" content="Yunesh Games — mobile games. Fog Town: Survival Tycoon.">
<style>
  :root { --bg: #f7f4ee; --card: #ffffff; --text: #23201b; --muted: #6b645a; --accent: #9a5f12; --line: #e4ddd0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #16181c; --card: #1f2227; --text: #ece8e1; --muted: #a39d93; --accent: #e9a548; --line: #31353c; }
  }
  :root[data-theme="dark"] { --bg: #16181c; --card: #1f2227; --text: #ece8e1; --muted: #a39d93; --accent: #e9a548; --line: #31353c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .muted { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .card h2 { margin: 0 0 4px; font-size: 1.25rem; }
  .card p { margin: 0 0 12px; }
  a { color: var(--accent); }
  .links a { margin-right: 16px; display: inline-block; }
</style>
</head>
<body>
<main>
  <h1>Yunesh Games</h1>
  <p class="muted">Mobile games / Mobil oyunlar</p>

  <section class="card">
    <h2>Fog Town: Survival Tycoon</h2>
    <p>Build a town in the fog, sell your loot and hold the wall against raids.<br>
       Siste bir kasaba kur, ganimetini sat, baskınlara karşı surları tut.</p>
    <p class="links">
      <a href="fogtown/privacy.html#en">Privacy Policy</a>
      <a href="fogtown/privacy.html#tr">Gizlilik Politikası</a>
    </p>
  </section>

  <p class="muted" style="margin-top:28px">Support / Destek: <a href="mailto:yemreakbass@gmail.com">yemreakbass@gmail.com</a></p>
</main>
</body>
</html>
